# CI: Tests und Linter für Backend und Frontend, Image-Build mit Starttest und
# Veröffentlichung auf ghcr.io (Konzept 5.8).
#
# Veröffentlicht wird nur bei einem Push auf main oder einem Versions-Tag v*,
# nie aus Pull Requests. Nur der Job "publish" hat Schreibrechte. Er lädt genau
# das Image hoch, das im Job "container" den Starttest bestanden hat.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          working-directory: backend
          enable-cache: true
          # Relativ zu working-directory (sonst sucht setup-uv backend/backend/uv.lock).
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
        env:
          TWINRAID_MODE: mock

  frontend:
    name: Frontend (ESLint, Prettier, tsc, Vitest, Build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scripts:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -x docker/*.sh backend/scripts/*.sh host-scripts/*.sh
      - run: >-
          shellcheck --shell=sh
          docker/rootfs/etc/s6-overlay/scripts/twinraid-preflight
          docker/rootfs/etc/s6-overlay/scripts/twinraid-init
          docker/rootfs/etc/s6-overlay/s6-rc.d/*/run
          docker/rootfs/etc/s6-overlay/s6-rc.d/*/finish
          docker/fake-target/start.sh

  # Wächter für Unraid Klein mit echtem Docker und tmpfs (Konzept 3.6). Läuft als root
  # auf dem Wegwerf-Runner und hält zwischendurch den Docker-Dienst an.
  source-guard:
    name: Source guard (real Docker)
    runs-on: ubuntu-24.04
    needs: [scripts]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo SOURCE_GUARD_TEST_HOST=disposable docker/source-guard-test.sh

  # Machbarkeitstest Z1 (host-scripts/zfs-check.sh) mit Pools in Dateien (Konzept 5.6).
  # zfsutils-linux nur hier in der CI, exakt gepinnt (Plan, Abschnitt 8). Bietet Ubuntu
  # die Version nicht mehr an, nennt der Schritt die neue; dann ZFS_VERSION anheben.
  zfs-check:
    name: ZFS check (file pools)
    runs-on: ubuntu-24.04
    needs: [scripts]
    timeout-minutes: 20
    env:
      ZFS_VERSION: 2.2.2-0ubuntu9.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ZFS (pinned)
        run: |
          sudo apt-get update -qq
          if ! sudo apt-get install -y --no-install-recommends "zfsutils-linux=${ZFS_VERSION}"; then
            echo "zfsutils-linux ${ZFS_VERSION} is not available; candidate:" >&2
            apt-cache policy zfsutils-linux >&2
            exit 1
          fi
          sudo modprobe zfs
      - run: sudo ZFS_CHECK_TEST_HOST=disposable docker/zfs-check-test.sh
      # guard.sh, Modus sync, mit echtem ZFS: Empfang als UID 64000 mit der Delegation aus
      # der Anleitung, Sperren, Aufbewahrung (Konzept 3.7, ab v0.5.1).
      - run: sudo GUARD_SYNC_TEST_HOST=disposable docker/guard-sync-test.sh

  container:
    name: Container (build and start test)
    runs-on: ubuntu-24.04
    needs: [backend, frontend, scripts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read version
        id: version
        run: >-
          echo "version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/src/twinraid/__init__.py)"
          >> "${GITHUB_OUTPUT}"
      # Nur amd64 (Unraid). Ohne BuildKit-Attestierungen: ein einfaches Manifest;
      # der Herkunftsnachweis kommt im Job "publish" über actions/attest.
      - name: Build image
        run: >-
          docker build --platform linux/amd64 --provenance=false --sbom=false
          --label "org.opencontainers.image.version=${VERSION}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          -f docker/Dockerfile -t twinraid:ci .
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - run: docker/smoke-test.sh twinraid:ci
        env:
          CHECK_EACH_CAP: "1"
      # SSH und Aktionen gegen ein nachgebautes Unraid Groß (Konzept 5.6).
      - run: docker/ssh-test.sh twinraid:ci
      - name: Save image for publishing
        if: github.event_name == 'push'
        run: docker save twinraid:ci | gzip -1 > twinraid-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: twinraid-image
          path: twinraid-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish image (ghcr.io)
    runs-on: ubuntu-24.04
    needs: [container, source-guard, zfs-check]
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Version tags must point into main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not point to a commit in main."
            exit 1
          fi
      - name: Compute image name and tags
        id: meta
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/src/twinraid/__init__.py)"
          docker/release-tags.sh "${GITHUB_REF}" "${GITHUB_SHA}" "${version}" > tags.txt
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
          echo "first_tag=$(head -n1 tags.txt)" >> "${GITHUB_OUTPUT}"
          echo "Tags:" && cat tags.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: twinraid-image
      - run: gunzip -c twinraid-image.tar.gz | docker load
      - name: Log in to ghcr.io
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        id: push
        run: |
          digest=""
          while read -r tag; do
            docker tag twinraid:ci "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}" | tee push.log
            pushed="$(grep -o 'digest: sha256:[0-9a-f]\{64\}' push.log | cut -d' ' -f2)"
            if [[ -n "${digest}" && "${pushed}" != "${digest}" ]]; then
              echo "::error::Tags point to different digests (${digest}, ${pushed})."
              exit 1
            fi
            digest="${pushed}"
          done < tags.txt
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Image must be pullable without login
        run: |
          docker logout ghcr.io
          docker/check-public-image.sh "${IMAGE}" "${FIRST_TAG}" "${DIGEST}"
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          FIRST_TAG: ${{ steps.meta.outputs.first_tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
