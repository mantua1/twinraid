# Dependabot: Sicherheits- und Versionsupdates (Konzept 5.4 und 5.8).
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-tooling:
        dependency-type: "development"
    ignore:
      # Typen folgen der Node-Hauptversion; die wechselt nur bewusst (.nvmrc, engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript-Hauptversion nur bewusst und erst, wenn typescript-eslint sie
      # unterstützt (8.71 verlangt typescript <6.1.0). Sonst erzwingt Dependabot das
      # Update mit --force, löst typescript-eslint neu auf und scheitert.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    # Digest- und Patch-Updates der Basis-Images kommen weiter als Pull Request,
    # weil sie Sicherheitsfixes enthalten. Nur Versionswechsel werden ignoriert.
    ignore:
      # Node-Hauptversion nur bewusst zusammen mit frontend/.nvmrc und engines.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Python-Version nur bewusst zusammen mit backend/.python-version.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
