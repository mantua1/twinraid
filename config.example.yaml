# TwinRaid-Konfiguration – Beispiel.
# Kopieren nach /mnt/user/appdata/twinraid/config/twinraid.yaml und anpassen.
# Im Container wird die Datei read-only nach /config/twinraid.yaml gemountet.
# Secrets (Passwort, SSH-Keys) gehören NICHT hierher (siehe Konzept 5.5).
# Alle Werte hier sind Beispielwerte, keine echten Adressen.

web:
  # port: 8443                 # optional, Standard 8443; bitte nicht ändern
  # Nur diese Clients dürfen zugreifen: ganze Netze oder einzelne Geräte (/32).
  # Im eigenen Netz von TwinRaid (Server-Netz) nur einzelne Geräte eintragen,
  # denn die Router-Firewall filtert nur zwischen Netzen (docs/EINRICHTUNG.md).
  allowed_networks:
    - 192.168.10.50/32         # Server-Netz: nur der Admin-PC
    - 192.168.20.0/24          # Client-Netz: ganz, die Router-Firewall regelt den Zugriff
  session_idle_minutes: 10     # optional, Standard 10
  default_language: de         # de | en
  tls:
    # Die IP von TwinRaid steht nur im Unraid-Template („Fixed IP address“) und
    # wird beim Start automatisch erkannt. Nur in Sonderfällen hier festlegen:
    # ip_addresses:
    #   - 192.168.10.20
    hostnames: []              # optional, z. B. twinraid.home.arpa

servers:
  source:                      # Unraid Klein – hier läuft der Container
    name: "Unraid Klein"
    host: 192.168.10.10
    webgui:                    # ohne Wirkung: Klein wird nicht geprüft
      scheme: http
      port: 80
  target:                      # Unraid Groß
    name: "Unraid Groß"
    host: 192.168.10.11
    webgui:                    # nur für die Online-Prüfung (TCP auf diesen Port)
      scheme: http             # wie „SSL/TLS verwenden“ in Unraid: Nein → http, Ja → https
      port: 80                 # optional, Standard 80 bei http, 443 bei https
    mac: "AA:BB:CC:DD:EE:FF"    # für Wake-on-LAN
    # Broadcast-Adresse für Wake-on-LAN; ohne Angabe aus dem eigenen Netz abgeleitet.
    # Nur nötig, wenn Groß in einem anderen Netz liegt als TwinRaid.
    # wol_broadcast: 192.168.10.255
    boot_timeout_minutes: 5    # so lange wartet TwinRaid nach dem Wecken auf Groß
    # ssh_port: 22             # optional, Standard 22 (Status, VM und Herunterfahren per SSH)

gaming_vm:
  display_name: "Gaming-VM"
  # Die VM selbst steht nur auf Groß in /boot/config/twinraid/power.conf (UUID).
  # Optional: ihr Name genau wie im Reiter VMs von Groß, zum Abgleich mit power.conf.
  unraid_vm_name: "Windows 11 Gaming"
  shutdown_timeout_minutes: 3  # danach wird "Erzwingen" angeboten

# Aktionen im Echtbetrieb (TWINRAID_MODE=real) einzeln freischalten. Standard: alles
# aus. Im Simulationsmodus sind alle Aktionen verfügbar. Nach einer Änderung den
# Container neu starten. Testreihenfolge: docs/EINRICHTUNG.md, Testprotokoll.
actions:
  wake: false                  # Groß wecken (Wake-on-LAN)
  vm: false                    # VM starten, herunterfahren, erzwingen
  shutdown: false              # Groß herunterfahren

sync:
  shares:                      # identische Namen auf beiden Servern
    - appdata
    - dokumente
    - medien
  appdata_share: appdata
  exclude:                     # wird nicht kopiert (relativ zu /mnt/user)
    - appdata/twinraid
  protect_on_target:           # wird auf Groß nie gelöscht
    - appdata/_twinraid
  max_deletions: 1000
  stop_containers: true
  never_stop:                  # werden für den Konsistenzlauf nie gestoppt
    - twinraid
  copy_templates: true
  schedule:
    enabled: true
    timezone: "Europe/Berlin"  # IANA-Zeitzone
    days: [sun]                # mon, tue, wed, thu, fri, sat, sun
    time: "03:00"              # HH:MM, immer in Anführungszeichen
    wake_target: true
    shutdown_after: true       # nur wenn der Sync geweckt hat und die VM aus ist
